name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section for this release
        run: |
          awk '/^## \[/ && !/\[Unreleased\]/ { if (found) exit; found=1; next } found { print }' \
            CHANGELOG.md > release_notes.md

      - name: Build addon zip
        id: zip
        run: |
          ADDON="RCLootCouncil_PriorityLoot"
          ZIP="${ADDON}-${{ steps.ver.outputs.version }}.zip"
          mkdir -p "dist/${ADDON}"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.claude/' \
            --exclude='.vscode/' \
            --exclude='.idea/' \
            --exclude='.gitignore' \
            --exclude='.luacheckrc' \
            --exclude='.busted' \
            --exclude='.pkgmeta' \
            --exclude='dist/' \
            --exclude='docs/' \
            --exclude='spec/' \
            --exclude='scripts/' \
            --exclude='*.gs' \
            --exclude='*.md' \
            . "dist/${ADDON}/"
          # Sanity check: only ship files that .toc loads, plus libs,
          # the .toc itself, and LICENSE. If anything else slips through,
          # fail the build so dead code does not silently rejoin the zip.
          UNEXPECTED=$(find "dist/${ADDON}" -type f \
            -not -name '*.toc' \
            -not -name 'LICENSE' \
            -not -path "*/Libs/*" \
            -not -path "*/Modules/*" \
            -not -path "*/Data/*" \
            -not -name 'Core.lua' \
            | sort)
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::Unexpected files in addon zip:"
            echo "$UNEXPECTED"
            exit 1
          fi
          cd dist
          zip -r "../${ZIP}" "${ADDON}/"
          echo "zip=${ZIP}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.ver.outputs.version }}"
          body_path: release_notes.md
          files: ${{ steps.zip.outputs.zip }}
          draft: false
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}

      # Uploads to CurseForge (project ID from the .toc's X-Curse-Project-ID
      # field) using the same release_notes.md excerpt as the GitHub Release
      # above, via .pkgmeta's manual-changelog directive -- otherwise this
      # action falls back to its own auto-generated git-log changelog, which
      # is what CurseForge showed before this step existed. Only these two
      # tokens are set (no WOWI_/WAGO_), so WoWInterface/Wago uploads are
      # skipped automatically; this repo doesn't publish to those sites.
      #
      # CF_API_KEY + CF_API_TOKEN, both set to the same secret: the v2 action
      # tag currently resolves to v2.5.1 (2025-12-02), whose release.sh only
      # reads CF_API_KEY -- CF_API_TOKEN support (upstream's "Normalize api
      # token env vars", 36b4c3b) landed on master afterward but hasn't
      # shipped in a tagged v2.x release yet. Setting CF_API_TOKEN alone
      # silently no-ops the whole CurseForge upload (release.sh's
      # upload_curseforge() returns 0 immediately when its token var is
      # empty, no error/log output at all) -- confirmed live: v0.6.0's
      # "CurseForge ID: 1608381" log line was missing the "[token set]"
      # suffix release.sh only prints when it actually resolved a token.
      # Once BigWigsMods tags a v2.x release including that commit, CF_API_KEY
      # becomes redundant but harmless to leave.
      - name: Package and release to CurseForge
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
